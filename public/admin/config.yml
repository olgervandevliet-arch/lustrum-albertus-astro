backend:
  name: github
  repo: olgervandevliet-arch/lustrum-albertus-astro
  branch: main
  base_url: https://lustrum-albertus-astro.vercel.app
  auth_endpoint: api/auth

site_url: https://lustrum-albertus-astro.vercel.app
logo_url: /uploads/AM-lustrum-fav.png

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "general"
    label: "Algemeen"
    files:
      - name: "site"
        label: "Site-instellingen"
        file: "src/data/site.json"
        fields:
          - { label: "Tekst mededelingenbalk", name: "announcementText", widget: "string" }
          - { label: "Link-tekst mededelingenbalk", name: "announcementLinkText", widget: "string" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
          - { label: "Instagram gebruikersnaam (bijv. @lustrumalbertus)", name: "instagramHandle", widget: "string" }
          - { label: "Contact e-mailadres", name: "contactEmail", widget: "string" }
          - { label: "Copyright-tekst footer", name: "footerCopyright", widget: "string" }
          - label: "Countdown datum/tijd"
            name: "countdownTargetDate"
            widget: "string"
            hint: "Exact formaat: JJJJ-MM-DDTUU:MM:SS, bijv. 2027-08-18T20:00:00"

  - name: "pages"
    label: "Pagina's"
    files:
      - name: "home"
        label: "Home"
        file: "src/data/pages/home.json"
        fields:
          - label: "Countdown datum/tijd"
            name: "countdownTargetDate"
            widget: "string"
            hint: "Exact formaat: JJJJ-MM-DDTUU:MM:SS, bijv. 2027-08-18T20:00:00"
          - label: "Video's"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Beschikbaar (anders 'Coming soon')", name: "available", widget: "boolean", default: false }
              - { label: "Coming soon", name: "comingSoon", widget: "boolean", default: true }
              - { label: "Titel", name: "title", widget: "string", required: false }
              - { label: "Thumbnail-afbeelding URL", name: "thumbnail", widget: "string", required: false }
              - { label: "YouTube embed-URL", name: "embed", widget: "string", required: false }

      - name: "pakketten"
        label: "Spaarpakketten"
        file: "src/data/pages/pakketten.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - label: "Pakketten"
            name: "packages"
            widget: "list"
            summary: "{{fields.name}} — €{{fields.price}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Totaalprijs (bijv. 850 of 1.075)", name: "price", widget: "string" }
              - { label: "Bedrag per maand bij 11 termijnen", name: "m11", widget: "string" }
              - { label: "Bedrag per maand bij 10 termijnen", name: "m10", widget: "string" }
              - label: "Kenmerken"
                name: "features"
                widget: "list"
                field: { label: "Kenmerk", name: "feature", widget: "string" }

      - name: "partners"
        label: "Partners & sponsoren"
        file: "src/data/pages/partners.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Beschrijving", name: "desc", widget: "text" }
              - { label: "Logo", name: "src", widget: "image" }

      - name: "faq"
        label: "Veelgestelde vragen"
        file: "src/data/pages/faq.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - label: "Vragen"
            name: "faqs"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Vraag", name: "q", widget: "string" }
              - { label: "Antwoord", name: "a", widget: "text" }

      - name: "contact"
        label: "Contact"
        file: "src/data/pages/contact.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - label: "Bestuursleden"
            name: "board"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Functie", name: "role", widget: "string" }
              - { label: "Foto", name: "photo", widget: "image" }

      - name: "kleuren"
        label: "Kleuren"
        file: "src/data/pages/kleuren.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - label: "Kleuren"
            name: "colors"
            widget: "list"
            summary: "{{fields.name}} — {{fields.hex}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "HEX", name: "hex", widget: "color", enableAlpha: false }
              - { label: "Tekstkleur op deze achtergrond (HEX)", name: "onHex", widget: "color", enableAlpha: false }
              - { label: "RGB", name: "rgb", widget: "string" }
              - { label: "CMYK", name: "cmyk", widget: "string" }
              - { label: "Pantone", name: "pantone", widget: "string" }
              - { label: "RAL", name: "ral", widget: "string" }
              - { label: "Link naar verf", name: "url", widget: "string" }

      - name: "thema"
        label: "Thema"
        file: "src/data/pages/thema.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - { label: "Icoon (Phosphor-icon class)", name: "icon", widget: "string" }

      - name: "terrein"
        label: "Terrein"
        file: "src/data/pages/terrein.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - { label: "Icoon (Phosphor-icon class)", name: "icon", widget: "string" }

      - name: "programma"
        label: "Programma"
        file: "src/data/pages/programma.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Beschrijving", name: "description", widget: "text" }
          - { label: "Icoon (Phosphor-icon class)", name: "icon", widget: "string" }
